<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خانه موبایل | لیست شکایت‌ها</title>
  <link rel="icon" href="../images/header/logo.jpg">
  <style>
    @font-face {
      font-family: "Vazir";
      src: url(../fonts/Vazir.eot) format("embedded-opentype"), url(../fonts/Vazir.woff) format("woff"), url(../fonts/Vazir.ttf) format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: "Vazir";
      background: lightgray;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #007bff;
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      animation: fadeDown 0.5s ease;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    header button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    header button:hover {
      background: #b91c1c;
    }

    main {
      margin-top: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: ghostwhite;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #007bff;
      color: white;
    }

    tr:hover {
      background: #f1f5f9;
    }

    button.delete {
      background: crimson;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    button.delete:hover {
      background: #a10000;
    }

    .empty {
      text-align: center;
      padding: 25px;
      font-weight: bold;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h2>خوش آمدی مدیر 👑</h2>
    <button id="logoutBtn">خروج از حساب</button>
  </header>

  <main>
    <h2 style="text-align:center; color:#333; margin-top:10px;">📋 لیست شکایت‌های ثبت‌شده</h2>
    <table id="table">
      <thead>
        <tr>
          <th>نام</th>
          <th>تماس</th>
          <th>موضوع</th>
          <th>توضیحات</th>
          <th>تاریخ</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script>
    // جلوگیری از دسترسی بدون ورود
    if (localStorage.getItem("adminLoggedIn") !== "true") {
      alert("🚫 دسترسی غیرمجاز! لطفاً وارد شوید.");
      window.location.href = "login2.html";
    }

    const tableBody = document.querySelector("tbody");
    const logoutBtn = document.getElementById("logoutBtn");
    const complaints = JSON.parse(localStorage.getItem("complaints") || "[]");

    function loadComplaints() {
      tableBody.innerHTML = "";
      if (complaints.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='6' class='empty'>هیچ شکایتی ثبت نشده است.</td></tr>";
        return;
      }

      complaints.forEach((c, i) => {
        const row = `
          <tr>
            <td>${c.name}</td>
            <td>${c.contact}</td>
            <td>${c.subject}</td>
            <td>${c.description}</td>
            <td>${c.date}</td>
            <td><button class="delete" onclick="deleteComplaint(${i})">🗑 حذف</button></td>
          </tr>`;
        tableBody.innerHTML += row;
      });
    }

    function deleteComplaint(index) {
      if (confirm("آیا از حذف این شکایت مطمئنید؟")) {
        complaints.splice(index, 1);
        localStorage.setItem("complaints", JSON.stringify(complaints));
        loadComplaints();
      }
    }

    // خروج از حساب
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("adminLoggedIn");
      alert("✅ از حساب خارج شدید.");
      window.location.href = "login2.html";
    });

    loadComplaints();
  </script>
</body>

</html>
