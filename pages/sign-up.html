<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خانه موبایل | ثبت نام</title>
  <link rel="icon" href="../images/header/logo.jpg">
  <style>
    @font-face {
      font-family: "Vazir";
      src: url(../fonts/Vazir.eot) format("embedded-opentype"),
        url(../fonts/Vazir.woff) format("woff"),
        url(../fonts/Vazir.ttf) format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Vazir";
      font-size: 14px;
      background-color: #eeeff1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin-bottom: 20px;
      color: #111;
    }

    .card {
      background-color: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    form {
      width: 100%;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .success {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
      font-size: 14px;
    }

    @media (max-width: 360px) {
      .card {
        padding: 18px 14px;
      }

      h2 {
        font-size: 16px;
      }
    }
  </style>

</head>

<body>
  <div class="card" style="text-align: center;">
    <h2>ثبت نام کاربر</h2>
    <form id="signupForm">
      <input id="fullname" required placeholder="نام کامل">
      <input id="username" required placeholder="نام کاربری">
      <input id="email" type="email" required placeholder="ایمیل">
      <input id="password" type="password" required placeholder="رمز عبور">
      <button type="submit">ثبت نام</button>
      <br>
      <br>
    </form>
    <div class="success" id="successBox">✅ ثبت نام با موفقیت انجام شد!</div>
  </div>
  <script>
    const form = document.getElementById('signupForm');
    const successBox = document.getElementById('successBox');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const user = {
        fullname: form.fullname.value.trim(),
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value.trim()
      };

      // ذخیره در userData
      localStorage.setItem('userData', JSON.stringify(user));

      // ذخیره واقعی در آرایه users
      let allUsers = JSON.parse(localStorage.getItem('users')) || [];
      const id = allUsers.length ? Math.max(...allUsers.map(u => u.id)) + 1 : 1;
      allUsers.push({ id, username: user.username, email: user.email, active: true, date: new Date().toLocaleDateString('fa-IR') });
      localStorage.setItem('users', JSON.stringify(allUsers));

      successBox.style.display = 'block';
      form.reset();
    });
  </script>
</body>

</html>
