<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خانه موبایل | کاربران</title>
    <link rel="icon" href="../images/header/logo.jpg">
    <style>
        @font-face {
            font-family: "Vazir";
            src: url(../fonts/Vazir.eot) format("embedded-opentype"), url(../fonts/Vazir.woff) format("woff"), url(../fonts/Vazir.ttf) format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: "Vazir";
            margin: 0;
            background: #0f1724;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: ghostwhite;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        input,
        select,
        button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 15px;
            background: #0f172a;
            color: #fff;
        }

        button {
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .danger {
            background: #dc2626;
        }

        .primary {
            background: #2563eb;
        }

        .success {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        th {
            cursor: pointer;
            background: #1e293b;
        }

        tr:hover {
            background: #33415544;
        }

        .btn-edit {
            background: #f59e0b;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
        }

        .btn-delete {
            background: #dc2626;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .status-active {
            color: #22c55e;
            font-weight: bold;
        }

        .status-inactive {
            color: #ef4444;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            animation: fade 0.3s;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 14px;
            width: 420px;
            animation: pop 0.3s;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pop {
            from {
                transform: scale(0.7);
            }

            to {
                transform: scale(1);
            }
        }

        .pagination {
            margin-top: 15px;
            text-align: center;
        }

        .pagination button {
            margin: 0 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <button id="logoutBtn">خروج از حساب</button>
        <h1>داشبورد مدیریت کاربران</h1>

        <div class="top-actions">
            <div>
                <input type="text" id="search" onkeyup="filterUsers()" placeholder="جستجوی کاربر...">
                <select id="statusFilter">
                    <option value="all">همه</option>
                    <option value="active">فعال</option>
                    <option value="inactive">غیرفعال</option>
                </select>
                <button class="primary" onclick="filterUsers()">فیلتر</button>
                <button class="danger" onclick="deleteAllUsers()"> حذف همه کاربران</button>
            </div>
            <button class="success" onclick="openAddModal()">➕ افزودن کاربر جدید</button>
        </div>

        <table id="userTable">
            <thead>
                <tr>
                    <th onclick="sortTable('id')">id</th>
                    <th onclick="sortTable('fullname')">نام کامل</th>
                    <th onclick="sortTable('username')">نام کاربری</th>
                    <th onclick="sortTable('email')">ایمیل</th>
                    <th onclick="sortTable('date')">ثبت‌نام</th>
                    <th onclick="sortTable('active')">وضعیت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="userBody"></tbody>
        </table>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Modal Add/Edit -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">افزودن کاربر</h2>

            <input type="text" id="modalFullname" placeholder="نام کامل"><br><br>
            <input type="text" id="modalUsername" placeholder="نام کاربری"><br><br>
            <input type="email" id="modalEmail" placeholder="ایمیل"><br><br>
            <input type="password" id="modalPassword" placeholder="رمز عبور"><br><br>

            <select id="modalStatus">
                <option value="true">فعال</option>
                <option value="false">غیرفعال</option>
            </select><br><br>

            <button class="success" onclick="saveUser()">ذخیره</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            alert("🚫 دسترسی غیرمجاز! لطفاً وارد شوید.");
            window.location.href = "login2.html";
        }
        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("adminLoggedIn");
            alert("✅ از حساب خارج شدید.");
            window.location.href = "login2.html";
        });
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let currentPage = 1;
        let rowsPerPage = 5;
        let sortField = null;
        let sortAsc = true;
        let editingUserId = null;

        function saveToStorage() { localStorage.setItem('users', JSON.stringify(users)); }

        function deleteAllUsers() {
            if (confirm('واقعا همه کاربران حذف شوند؟')) {
                users = [];
                saveToStorage();
                renderUsers();
            }
        }

        function renderUsers() {
            let filtered = users.slice();
            const searchText = document.getElementById('search').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            if (searchText) filtered = filtered.filter(u => u.username.toLowerCase().includes(searchText) || u.fullname.toLowerCase().includes(searchText));
            if (status !== 'all') filtered = filtered.filter(u => (u.active ? 'active' : 'inactive') === status);

            if (sortField) {
                filtered.sort((a, b) => {
                    if (a[sortField] < b[sortField]) return sortAsc ? -1 : 1;
                    if (a[sortField] > b[sortField]) return sortAsc ? 1 : -1;
                    return 0;
                });
            }

            const tbody = document.getElementById('userBody');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * rowsPerPage;
            const paginated = filtered.slice(start, start + rowsPerPage);

            paginated.forEach(u => {
                tbody.innerHTML += `
      <tr>
        <td>${u.id}</td>
        <td>${u.fullname}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td>${u.date}</td>
        <td class='${u.active ? 'status-active' : 'status-inactive'}'>${u.active ? 'فعال' : 'غیرفعال'}</td>
        <td>
          <button class='btn-edit' onclick='openEditModal(${u.id})'>ویرایش</button>
          <button class='btn-delete' onclick='deleteUser(${u.id})'>حذف</button>
        </td>
      </tr>`;
            });

            renderPagination(filtered.length);
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / rowsPerPage);
            const pagDiv = document.getElementById('pagination');
            pagDiv.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === currentPage) btn.style.fontWeight = 'bold';
                btn.onclick = () => { currentPage = i; renderUsers(); };
                pagDiv.appendChild(btn);
            }
        }

        function sortTable(field) {
            if (sortField === field) sortAsc = !sortAsc;
            else { sortField = field; sortAsc = true; }
            renderUsers();
        }

        function filterUsers() { currentPage = 1; renderUsers(); }

        function deleteUser(id) {
            if (confirm('آیا مطمئن هستید؟')) {
                users = users.filter(u => u.id !== id);
                saveToStorage();
                renderUsers();
            }
        }

        function openAddModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'افزودن کاربر';
            document.getElementById('modalFullname').value = '';
            document.getElementById('modalUsername').value = '';
            document.getElementById('modalEmail').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalStatus').value = 'true';
            document.getElementById('userModal').style.display = 'flex';
        }

        function openEditModal(id) {
            editingUserId = id;
            const u = users.find(x => x.id === id);
            document.getElementById('modalTitle').textContent = 'ویرایش کاربر';
            document.getElementById('modalFullname').value = u.fullname;
            document.getElementById('modalUsername').value = u.username;
            document.getElementById('modalEmail').value = u.email;
            document.getElementById('modalPassword').value = u.password || ''; // اگر پسورد ذخیره شده باشد
            document.getElementById('modalStatus').value = u.active;
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        function saveUser() {
            const fullname = document.getElementById('modalFullname').value.trim();
            const username = document.getElementById('modalUsername').value.trim();
            const email = document.getElementById('modalEmail').value.trim();
            const password = document.getElementById('modalPassword').value.trim();
            const active = document.getElementById('modalStatus').value === 'true';

            if (!fullname || !username || !email || !password) {
                alert('پر کردن همه فیلدها الزامی است');
                return;
            }

            if (editingUserId) {
                // ویرایش کاربر
                const u = users.find(x => x.id === editingUserId);
                u.fullname = fullname;
                u.username = username;
                u.email = email;
                u.password = password;
                u.active = active;
            } else {
                // افزودن کاربر جدید
                const id = users.length ? Math.max(...users.map(x => x.id)) + 1 : 1;
                const date = new Date().toLocaleDateString('fa-IR');
                users.push({ id, fullname, username, email, password, active, date });
            }

            saveToStorage();
            closeModal();
            renderUsers();
        }
    </script>
</body>

</html>
